              "118z0ypqa8Ujq_tA3VyhH40dYOKYFsltg", "1lFspN8de5kqCjlOVVL-q0AyY3ECy_r4_",
              "12n1I6CucRwZ6gNHERA3BOlteVc9oFUtE", "1EdR2hcPEYnbKitIrDk0oIXYD7RYP6AKF",
              "14a-eqVdCCzctKaeIdXq2-z21AIzC8LTA", "1bJMKeM71XwunGmF91AXjQfsJPt0sOILJ",
              "12iyf90NUGZim3cDKJSfgL_yWTCxVWjE2", "1g84EMjsUFlw8Vs1p3smzFjPN70tyGIGS",
              "1O3B5LRHKQvSP466GT3pt6UVQA3JPKXrT", "1yDB2dBXTBqPs7EAs2hglhRbj6rrORJsZ",
              "1ZZVVJNsPmNLCEV1mHKUuR3WvLYF4lLRq", "1KW8ZOPxzjTYxVl0nvaDFr9GfkN0tn3WJ",
              "1lxmBdxPdWXU1Z7XvimEcg2EcXBI-G5rT", "1AI-q2SHPMjjZeMyDkivYCddUuBD-q3uq",
              "1dQcy7jtEANig7IqBEDTNIO3O0YFWUzun", "17mRcDSjzRWMF4w-_y9Ebq7_3RH6Oy6am",
              "1WZDwl_s-gErmAXcHUWA1cZiAXIpAkfXl", "113Q7-pr-j8bhMZCq95PRScNTkMh_gt36",
              "1LjfLoue3Lbknh50likWDrHKZGpqxCofb",
          ]))
          KEY = os.environ.get("DRIVE_API_KEY", "").strip()
          BUDGET = 5 * 3600 + 10 * 60      # stop cleanly before GitHub's 6 hour job limit
          MAX_BYTES = 95 * 1024 * 1024     # GitHub rejects files over 100 MB
          CHUNK = 200                      # files per commit
          WORKERS = 6
          START = time.time()
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")

          API = "https://www.googleapis.com/drive/v3/files"
          FOLDER_MT = "application/vnd.google-apps.folder"
          SHORTCUT_MT = "application/vnd.google-apps.shortcut"
          NOISE = {"PART", "PAGE", "FILE", "LEC", "LECT", "CHAP", "UNIT", "SEC", "FIG", "TOP", "NO", "SET", "WEEK", "DAY"}
          CODE_RE = re.compile(r"(?<![A-Za-z])([A-Za-z]{2,4})[\s_\-]?(\d{3})(?!\d)")


          def find_code(text):
              for m in CODE_RE.finditer(text):
                  if m.group(1).upper() not in NOISE:
                      return (m.group(1) + m.group(2)).upper()
              return None


          def course_code(name, path):
              c = find_code(name)
              if c:
                  return c
              for part in reversed([p for p in path.split("/") if p]):
                  c = find_code(part)
                  if c:
                      return c
              return "Other"


          def http_get(url, tries=6):
              last = None
              for a in range(tries):
                  try:
                      with urllib.request.urlopen(url, timeout=120) as r:
                          return r.read()
                  except urllib.error.HTTPError as e:
                      body = e.read()[:400]
                      last = "HTTP %s %r" % (e.code, body)
                      if e.code in (429, 500, 502, 503, 504) or (e.code == 403 and b"ateLimit" in body):
                          time.sleep(min(60, 2 ** a))
                          continue
                      break
                  except Exception as e:
                      last = repr(e)
                      time.sleep(min(60, 2 ** a))
              raise RuntimeError(last)


          def root_name(fid):
              try:
                  q = urllib.parse.urlencode({"fields": "name", "supportsAllDrives": "true", "key": KEY})
                  return json.loads(http_get("%s/%s?%s" % (API, fid, q), tries=3)).get("name", "")
              except Exception:
                  return ""


          def list_tree(root_id):
              out = []
              stack = [(root_id, "/" + root_name(root_id))]
              try:
                  while stack:
                      fid, path = stack.pop()
                      token = None
                      while True:
                          params = {
                              "q": "'%s' in parents and trashed=false" % fid,
                              "key": KEY,
                              "pageSize": 1000,
                              "fields": "nextPageToken,files(id,name,mimeType,size)",
                              "supportsAllDrives": "true",
                              "includeItemsFromAllDrives": "true",
                          }
                          if token:
                              params["pageToken"] = token
                          d = json.loads(http_get(API + "?" + urllib.parse.urlencode(params)))
                          for f in d.get("files", []):
                              if f["mimeType"] == FOLDER_MT:
                                  stack.append((f["id"], path + "/" + f["name"]))
                              else:
                                  f["path"] = path
                                  out.append(f)
                          token = d.get("nextPageToken")
                          if not token:
                              break
              except Exception as e:
                  print("list failed for", root_id, str(e)[:200])
              return out


          def list_local():
              import gdown
              out = []
              for i, fid in enumerate(FOLDERS):
                  d = "/tmp/_dl/%d" % i
                  try:
                      gdown.download_folder(url="https://drive.google.com/drive/folders/" + fid,
                                            output=d, quiet=True, use_cookies=False, remaining_ok=True)
                  except Exception as e:
                      print("gdown failed for", fid, e)
                  for root, _, names in os.walk(d):
                      rel = os.path.relpath(root, d)
                      for n in names:
                          p = os.path.join(root, n)
                          out.append({"id": hashlib.md5(p.encode()).hexdigest(), "name": n,
                                      "path": "" if rel == "." else rel, "mimeType": "",
                                      "size": str(os.path.getsize(p)), "local": p})
              return out


          def fetch(item, dest):
              if os.path.exists(dest):
                  return
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              tmp = dest + ".part"
              try:
                  if item.get("local"):
                      shutil.copyfile(item["local"], tmp)
                  else:
                      if item["mimeType"].startswith("application/vnd.google-apps."):
                          url = "%s/%s/export?%s" % (API, item["id"], urllib.parse.urlencode(
                              {"mimeType": "application/pdf", "key": KEY}))
                      else:
                          url = "%s/%s?%s" % (API, item["id"], urllib.parse.urlencode(
                              {"alt": "media", "supportsAllDrives": "true", "key": KEY}))
                      data = http_get(url)
                      with open(tmp, "wb") as fh:
                          fh.write(data)
                  os.replace(tmp, dest)
              except Exception:
                  if os.path.exists(tmp):
                      os.remove(tmp)
                  raise


          def commit_push(msg):
              subprocess.run(["git", "add", "-A"], check=True)
              if subprocess.run(["git", "diff", "--cached", "--quiet"]).returncode == 0:
                  return
              subprocess.run(["git", "commit", "-q", "-m", msg], check=True)
              for a in range(6):
                  if subprocess.run(["git", "push", "-q", "origin", "HEAD:" + BRANCH]).returncode == 0:
                      return
                  time.sleep(5 * (a + 1))
                  subprocess.run(["git", "pull", "-q", "--rebase", "origin", BRANCH])
              raise RuntimeError("git push failed")


          def build_plan(files):
              files = sorted(files, key=lambda f: (f["path"], f["name"], f["id"]))
              used, plan = set(), []
              for f in files:
                  mt = f["mimeType"]
                  if mt == SHORTCUT_MT:
                      continue
                  name = f["name"]
                  if mt.startswith("application/vnd.google-apps."):
                      if not name.lower().endswith(".pdf"):
                          name += ".pdf"
                  elif int(f.get("size") or 0) > MAX_BYTES:
                      print("skip (over 95MB):", f["path"], f["name"])
                      continue
                  safe = re.sub(r'[\\/:*?"<>|\x00-\x1f]+', "_", name).strip(". ") or f["id"]
                  if len(safe) > 150:
                      stem, ext = os.path.splitext(safe)
                      safe = stem[:140] + ext[:10]
                  code = course_code(name, f["path"])
                  dest = "%s/%s" % (code, safe)
                  # same name already planned in this run (e.g. same file in two drives): skip it
                  if dest.lower() in used:
                      continue
                  used.add(dest.lower())
                  plan.append((f, dest))
              return plan


          def main():
              print("mode:", "Drive API" if KEY else "gdown (no API key: max 50 files per folder)")
              if KEY:
                  files = []
                  with ThreadPoolExecutor(WORKERS) as ex:
                      for res in ex.map(list_tree, FOLDERS):
                          files += res
              else:
                  files = list_local()
              print("files found in Drive:", len(files), flush=True)

              plan = build_plan(files)
              todo = [(f, d) for f, d in plan if not os.path.exists(d)]
              print("planned %d, already in repo %d, to do %d" % (len(plan), len(plan) - len(todo), len(todo)), flush=True)

              done = failed = 0
              more = False
              for i in range(0, len(todo), CHUNK):
                  if time.time() - START > BUDGET:
                      more = True
                      print("time budget reached, continuing in a new run")
                      break
                  # pick up files the other workflow added meanwhile, so nothing is uploaded twice
                  subprocess.run(["git", "pull", "-q", "--rebase", "origin", BRANCH])
                  chunk = [(f, d) for f, d in todo[i:i + CHUNK] if not os.path.exists(d)]
                  if not chunk:
                      continue
                  with ThreadPoolExecutor(WORKERS) as ex:
                      futs = {ex.submit(fetch, f, d): d for f, d in chunk}
                      for fu in as_completed(futs):
                          try:
                              fu.result()
                              done += 1
                          except Exception as e:
                              failed += 1
                              print("FAILED", futs[fu], str(e)[:200])
                  commit_push("sync2: add files %d-%d of %d" % (i + 1, i + len(chunk), len(todo)))
                  print("progress: %d added, %d failed, %d left" % (done, failed, len(todo) - i - CHUNK), flush=True)

              if failed and done and not more:
                  more = True   # retry the failed ones in a fresh run

              if not more:
                  print("ALL DONE. Added this run:", done)

              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a") as fh:
                      fh.write("more=%s\n" % ("true" if more else "false"))


          if __name__ == "__main__":
              main()
          PY
      - name: Continue in a new run if work remains
        if: steps.sync.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.inputs.n }}
        run: |
          if [ "${N:-1}" -lt 40 ]; then gh workflow run drive-sync-2.yml -f n=$((${N:-1}+1)); fi
