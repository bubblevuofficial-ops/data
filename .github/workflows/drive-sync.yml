              "1bJMKeM71XwunGmF91AXjQfsJPt0sOILJ",
              "12iyf90NUGZim3cDKJSfgL_yWTCxVWjE2",
              "1g84EMjsUFlw8Vs1p3smzFjPN70tyGIGS",
              "1yDB2dBXTBqPs7EAs2hglhRbj6rrORJsZ",
              "1ZZVVJNsPmNLCEV1mHKUuR3WvLYF4lLRq",
              "1KW8ZOPxzjTYxVl0nvaDFr9GfkN0tn3WJ",
              "1lxmBdxPdWXU1Z7XvimEcg2EcXBI-G5rT",
              "1AI-q2SHPMjjZeMyDkivYCddUuBD-q3uq",
              "1dQcy7jtEANig7IqBEDTNIO3O0YFWUzun",
              "17mRcDSjzRWMF4w-_y9Ebq7_3RH6Oy6am",
              "113Q7-pr-j8bhMZCq95PRScNTkMh_gt36",
              "1LjfLoue3Lbknh50likWDrHKZGpqxCofb",
          ]
          SINGLE_FILES = [
              "1ZYJKdsN8mbzvLJe21nFC9JhFFkxOqUrg",
              "1e_bf3ZirLSjStG_WVB8KGunbjLJzDdpN",
              "140TibBMBHlEQw_ViG_3uanQ9jesB7Mtg",
              "1HwQEr82cOXcUCt645upiP5lwKZ_qR-LY",
          ]
          KEY = os.environ.get("DRIVE_API_KEY", "").strip()
          BRANCH = os.environ.get("GITHUB_REF_NAME", "main")
          BUDGET = 5 * 3600 + 5 * 60        # stop cleanly before the 6 hour limit
          MAX_BYTES = 95 * 1024 * 1024      # GitHub rejects files over 100 MB
          CHUNK_FILES = 150                 # max files per commit
          CHUNK_BYTES = 300 * 1024 * 1024   # max MB per commit/push
          WORKERS = 6
          START = time.time()
          STATE = ".sync_state.json"        # remembers finished folders (delete it to rescan everything)

          API = "https://www.googleapis.com/drive/v3/files"
          FOLDER_MT = "application/vnd.google-apps.folder"
          SHORTCUT_MT = "application/vnd.google-apps.shortcut"
          NOISE = {"PART", "PAGE", "FILE", "LEC", "LECT", "CHAP", "UNIT", "SEC", "FIG", "TOP", "NO", "SET", "WEEK", "DAY"}
          CODE_RE = re.compile(r"(?<![A-Za-z])([A-Za-z]{2,4})[\s_\-]?(\d{3})(?!\d)")


          def sh(*cmd):
              return subprocess.run(list(cmd)).returncode


          def find_code(text):
              for m in CODE_RE.finditer(text):
                  if m.group(1).upper() not in NOISE:
                      return (m.group(1) + m.group(2)).upper()
              return None


          def course_code(name, path):
              c = find_code(name)
              if c:
                  return c
              for part in reversed([p for p in path.split("/") if p]):
                  c = find_code(part)
                  if c:
                      return c
              return "Other"


          def http_open(url, tries=7):
              last = None
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(url, timeout=120)
                  except urllib.error.HTTPError as e:
                      body = e.read()[:400]
                      last = "HTTP %s %r" % (e.code, body)
                      retry = e.code in (429, 500, 502, 503, 504) or (
                          e.code == 403 and (b"ateLimit" in body or b"uota" in body))
                      if not retry:
                          break
                      time.sleep(min(90, 3 * 2 ** a))
                  except Exception as e:
                      last = repr(e)
                      time.sleep(min(60, 2 ** a))
              raise RuntimeError(last)


          def http_json(url):
              with http_open(url) as r:
                  return json.loads(r.read())


          def root_name(fid):
              try:
                  q = urllib.parse.urlencode({"fields": "name", "supportsAllDrives": "true", "key": KEY})
                  return http_json("%s/%s?%s" % (API, fid, q)).get("name", "")
              except Exception:
                  return ""


          def list_tree(root_id):
              """returns (files, ok). ok=False if listing broke half way."""
              out, ok = [], True
              stack = [(root_id, "/" + root_name(root_id))]
              try:
                  while stack:
                      fid, path = stack.pop()
                      token = None
                      while True:
                          params = {
                              "q": "'%s' in parents and trashed=false" % fid,
                              "key": KEY, "pageSize": 1000,
                              "fields": "nextPageToken,files(id,name,mimeType,size)",
                              "supportsAllDrives": "true", "includeItemsFromAllDrives": "true",
                          }
                          if token:
                              params["pageToken"] = token
                          d = http_json(API + "?" + urllib.parse.urlencode(params))
                          for f in d.get("files", []):
                              if f["mimeType"] == FOLDER_MT:
                                  stack.append((f["id"], path + "/" + f["name"]))
                              else:
                                  f["path"] = path
                                  f["root"] = root_id
                                  out.append(f)
                          token = d.get("nextPageToken")
                          if not token:
                              break
              except Exception as e:
                  ok = False
                  print("LIST FAILED", root_id, str(e)[:200], flush=True)
              return out, ok


          def get_single(fid):
              q = urllib.parse.urlencode({"key": KEY, "fields": "id,name,mimeType,size", "supportsAllDrives": "true"})
              f = http_json("%s/%s?%s" % (API, fid, q))
              f["path"] = ""
              f["root"] = "single:" + fid
              return f


          def fetch(item, dest):
              if os.path.exists(dest):
                  return 0
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              tmp = dest + ".part"
              if item["mimeType"].startswith("application/vnd.google-apps."):
                  url = "%s/%s/export?%s" % (API, item["id"], urllib.parse.urlencode(
                      {"mimeType": "application/pdf", "key": KEY}))
              else:
                  url = "%s/%s?%s" % (API, item["id"], urllib.parse.urlencode(
                      {"alt": "media", "supportsAllDrives": "true", "key": KEY}))
              last = None
              for a in range(3):
                  try:
                      with http_open(url) as r, open(tmp, "wb") as fh:
                          shutil.copyfileobj(r, fh, 1024 * 1024)
                      os.replace(tmp, dest)
                      return os.path.getsize(dest)
                  except Exception as e:
                      last = e
                      time.sleep(3 * (a + 1))
              if os.path.exists(tmp):
                  os.remove(tmp)
              raise RuntimeError(str(last))


          def clean_parts():
              for root, _, names in os.walk("."):
                  if ".git" in root.split(os.sep):
                      continue
                  for n in names:
                      if n.endswith(".part"):
                          try:
                              os.remove(os.path.join(root, n))
                          except OSError:
                              pass


          def commit_push(msg):
              """True if everything is pushed (or nothing to push)."""
              clean_parts()
              sh("git", "add", "-A")
              if sh("git", "diff", "--cached", "--quiet") == 0:
                  return True
              sh("git", "commit", "-q", "-m", msg)
              for a in range(8):
                  if sh("git", "push", "-q", "origin", "HEAD:" + BRANCH) == 0:
                      return True
                  time.sleep(5 * (a + 1))
                  if sh("git", "pull", "-q", "--rebase", "--autostash", "origin", BRANCH) != 0:
                      sh("git", "rebase", "--abort")
              print("PUSH FAILED after retries", flush=True)
              return False


          def build_plan(files):
              files = sorted(files, key=lambda f: (f["path"], f["name"], f["id"]))
              used, plan = set(), []
              for f in files:
                  mt = f["mimeType"]
                  if mt == SHORTCUT_MT:
                      continue
                  name = f["name"]
                  if mt.startswith("application/vnd.google-apps."):
                      if not name.lower().endswith(".pdf"):
                          name += ".pdf"
                  elif int(f.get("size") or 0) > MAX_BYTES:
                      print("skip (over 95MB):", f["path"], f["name"])
                      continue
                  safe = re.sub(r'[\\/:*?"<>|\x00-\x1f]+', "_", name).strip(". ") or f["id"]
                  if len(safe) > 150:
                      stem, ext = os.path.splitext(safe)
                      safe = stem[:140] + ext[:10]
                  code = course_code(name, f["path"])
                  dest = "%s/%s" % (code, safe)
                  if dest.lower() in used:      # same name already planned (same file in 2 folders)
                      continue
                  used.add(dest.lower())
                  plan.append((f, dest))
              return plan


          def load_state():
              try:
                  return set(json.load(open(STATE)).get("done", []))
              except Exception:
                  return set()


          def save_state(done):
              json.dump({"done": sorted(done)}, open(STATE, "w"), indent=1)


          def main():
              if not KEY:
                  print("ERROR: DRIVE_API_KEY secret is missing")
                  raise SystemExit(1)

              done_roots = load_state()
              todo_roots = [x for x in FOLDERS if x not in done_roots]
              todo_singles = [x for x in SINGLE_FILES if ("single:" + x) not in done_roots]
              print("folders: %d total, %d already finished (skipped), %d to scan" % (
                  len(FOLDERS), len(FOLDERS) - len(todo_roots), len(todo_roots)), flush=True)

              files, ok_roots = [], {}
              with ThreadPoolExecutor(WORKERS) as ex:
                  for rid, (res, ok) in zip(todo_roots, ex.map(list_tree, todo_roots)):
                      files += res
                      ok_roots[rid] = ok
              for fid in todo_singles:
                  try:
                      files.append(get_single(fid))
                      ok_roots["single:" + fid] = True
                  except Exception as e:
                      print("FILE FAILED", fid, str(e)[:200], flush=True)

              seen, uniq = set(), []
              for f in files:
                  if f["id"] in seen:
                      continue
                  seen.add(f["id"])
                  uniq.append(f)
              files = uniq
              print("files found in Drive:", len(files), flush=True)

              plan = build_plan(files)
              todo = [(f, d) for f, d in plan if not os.path.exists(d)]
              print("planned %d, already in repo %d, to do %d" % (len(plan), len(plan) - len(todo), len(todo)), flush=True)

              done = failed = 0
              more = False
              pushed_ok = True
              i = 0
              while i < len(todo):
                  if time.time() - START > BUDGET:
                      more = True
                      print("time budget reached, continuing in a new run", flush=True)
                      break
                  chunk, size = [], 0
                  while i < len(todo) and len(chunk) < CHUNK_FILES and size < CHUNK_BYTES:
                      chunk.append(todo[i])
                      size += int(todo[i][0].get("size") or 0)
                      i += 1
                  with ThreadPoolExecutor(WORKERS) as ex:
                      futs = {ex.submit(fetch, f, d): d for f, d in chunk}
                      for fu in as_completed(futs):
                          try:
                              fu.result()
                              done += 1
                          except Exception as e:
                              failed += 1
                              print("FAILED", futs[fu], str(e)[:200], flush=True)
                  if not commit_push("sync: %d/%d files" % (i, len(todo))):
                      pushed_ok = False
                      more = True
                      break
                  print("progress: %d added, %d failed, %d left" % (done, failed, len(todo) - i), flush=True)

              # mark folders that are 100% present in the repo as finished
              complete = {}
              for f, d in plan:
                  r = f["root"]
                  complete[r] = complete.get(r, True) and os.path.exists(d)
              newly = 0
              for r, ok in ok_roots.items():
                  if ok and complete.get(r, True):
                      if r not in done_roots:
                          newly += 1
                      done_roots.add(r)
              save_state(done_roots)
              print("folders finished so far: %d (+%d this run)" % (len(done_roots), newly), flush=True)

              if failed and done and not more:
                  more = True       # retry failed files in a fresh run
              if not more and not all(ok_roots.values()):
                  more = True       # some folder could not be listed: try again
                  if not done and newly == 0:
                      more = False  # nothing improved, stop looping

              if not more:
                  counts = {}
                  for code in sorted(os.listdir(".")):
                      if os.path.isdir(code) and not code.startswith("."):
                          counts[code] = sum(len(fs) for _, _, fs in os.walk(code))
                  lines = ["# VU files", "", "| Folder | Files |", "|---|---|"]
                  lines += ["| %s | %d |" % (k, v) for k, v in counts.items()]
                  lines += ["", "Total: %d" % sum(counts.values())]
                  open("FILES.md", "w").write("\n".join(lines) + "\n")
                  print("ALL DONE. Total files:", sum(counts.values()), flush=True)

              commit_push("sync: update state")
              out = os.environ.get("GITHUB_OUTPUT")
              if out:
                  with open(out, "a") as fh:
                      fh.write("more=%s\n" % ("true" if more else "false"))


          main()
          PY
      - name: Continue in a new run if work remains
        if: steps.sync.outputs.more == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.inputs.n }}
        run: |
          if [ "${N:-1}" -lt 60 ]; then gh workflow run drive-sync.yml -f n=$((${N:-1}+1)); fi
