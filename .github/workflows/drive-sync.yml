name: drive-sync
on:
  workflow_dispatch:
    inputs:
      n:
        description: "run number in chain (leave 1)"
        default: "1"
permissions:
  contents: write
  actions: write
concurrency:
  group: drive-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download from Drive, sort by course, push
        id: sync
        env:
          DRIVE_API_KEY: ${{ secrets.DRIVE_API_KEY }}
        run: |
          git config user.name "drive-sync-bot"
          git config user.email "drive-sync-bot@users.noreply.github.com"
          python3 - <<'PY'
